<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213C">
<!-- WEB-FONTS-START: removed from the offline Android build -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- WEB-FONTS-END -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Momentum</title>
<style>
:root{--bg:#E8EDF3;--card:#fff;--ink:#13213C;--mut:#5B6882;--line:#D5DDE8;--teal:#12A594;--sun:#F5A400;--rose:#E5484D;--btn:#13213C;--btnt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1526;--card:#172239;--ink:#EAF0FA;--mut:#8D9BB5;--line:#26334F;--btn:#EAF0FA;--btnt:#0D1526;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1526;--card:#172239;--ink:#EAF0FA;--mut:#8D9BB5;--line:#26334F;--btn:#EAF0FA;--btnt:#0D1526;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px}
h1,h2,.num{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0}
main{max-width:600px;margin:0 auto;padding:18px 18px calc(88px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 14px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
.top h1{font-size:25px;font-weight:800;line-height:1.12;letter-spacing:-.03em}
.top p{margin:5px 0 0;color:var(--mut);max-width:30ch;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--mut);margin-bottom:6px}
.progress-strip{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin:2px 0 5px}.progress-strip b{color:var(--ink);font-size:14px}.progress{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:17px}.progress i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .3s}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.sec{font-size:14px;font-weight:750;margin:17px 2px 8px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:9px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.add>input{width:100%}.add details{grid-column:1/-1;font-size:13px}.add details input{margin-top:6px;width:100%}.add summary{cursor:pointer;padding:2px 0}
.btn{background:var(--btn);color:var(--btnt);border-radius:14px;padding:12px 18px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:500;transition:transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.fl{font-weight:700;font-size:14px}
.task{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.done .chk{background:var(--teal);border-color:var(--teal)}
.done .tt{text-decoration:line-through;color:var(--mut)}
.tt{flex:1;word-break:break-word}
.ic{color:var(--mut);padding:6px 8px;font-size:18px}
.ic.star{color:var(--sun)}
.arm{color:var(--rose);font-weight:700;font-size:14px}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.hit .bar i{background:var(--sun)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gt{font-weight:700}
.sub{color:var(--mut);font-size:14px}
.sm{background:var(--bg);border-radius:10px;padding:7px 11px;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.dot{min-width:0;text-align:center;font-size:11px;color:var(--mut);padding:5px 2px;border-radius:12px;background:var(--bg)}
.dot b{display:grid;place-items:center;height:24px;border-radius:50%;margin:4px auto 0;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.dot.on b{background:var(--teal);border-color:var(--teal);color:#fff}
.dot.today{color:var(--ink);font-weight:800}.dot.today b{border-color:var(--sun)}
.big{font-size:34px;font-weight:800;color:var(--sun);line-height:1}
.form{display:grid;grid-template-columns:1fr 90px 110px auto;gap:8px;margin-bottom:12px}
@media(max-width:520px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:180px;padding:10px 4px;border-radius:14px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
nav button span{font-size:20px}
nav .on{background:var(--bg);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--btn);color:var(--btnt);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.foot button{color:var(--mut);font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:10px}
.section-label{font-size:12px;color:var(--mut);font-weight:750;margin:5px 2px 2px}.daynav{display:flex;align-items:center;gap:6px}.daynav input{padding:6px 8px;font-size:12px;width:132px}.hint{font-size:12px;color:var(--mut)}
.profile-btn{display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:12px;font-weight:700;max-width:150px}.avatar{width:28px;height:28px;border-radius:50%;background:var(--teal);color:white;display:grid;place-items:center;font-size:13px}.profile-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-panel{position:absolute;z-index:5;right:0;top:calc(100% - 8px);width:min(285px,calc(100vw - 36px));padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px #0002}.profile-panel h3{font-size:14px;margin:0 0 8px}.profile-panel select{width:100%;padding:9px 11px;margin-bottom:10px}.profile-panel form{display:grid;grid-template-columns:1fr auto;gap:6px}.profile-panel input{padding:9px 10px}.profile-panel .btn{padding:9px 12px}.profile-remove{font-size:12px;color:var(--rose);padding:10px 2px 0}.completed-group{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}.completed-group summary{font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}.daynav button{font-size:12px;padding:6px 9px}
.streak-button{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:6px 8px;border-radius:12px;background:var(--bg);color:var(--ink)}.streak-button b{font-size:18px}.streak-button span{font-size:10px;color:var(--mut)}.habit-actions{margin-top:8px}
.modal-backdrop{position:fixed;inset:0;z-index:20;background:#07111f80;display:grid;place-items:center;padding:18px}.modal{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 50px #0003}.modal h2{font-size:20px;margin:0 0 5px}.modal p{color:var(--mut);font-size:14px;margin:8px 0}.modal .row{margin-top:14px}.week-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}.week-mini span{text-align:center;font-size:11px;color:var(--mut)}.week-mini b{display:grid;place-items:center;width:28px;height:28px;margin:5px auto 0;border-radius:50%;background:var(--bg);color:var(--mut)}.week-mini b.on{background:var(--teal);color:white}
@media(max-width:400px){main{padding-left:14px;padding-right:14px}.top h1{font-size:22px}.profile-btn{max-width:116px}.profile-name{max-width:56px}.daynav input{width:122px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
