<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daymark · Habit tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#21372e;font:16px/1.5 Inter,system-ui,sans-serif}header,main{width:min(1020px,92%);margin:auto}header{padding:24px 0;border-bottom:1px solid #cdd5cb;display:flex;align-items:center;gap:10px;font-size:23px;font-weight:750}.mark{background:#254e3a;color:#ccef99;border-radius:10px;padding:0 9px;font-size:27px}main{padding:40px 0}h1,h2,h3,p{margin:0}h1{font:clamp(42px,7vw,72px)/1.15 Georgia,serif;letter-spacing:-2px}small,.meta{color:#586b60}.hero{background:#204b38;color:white;padding:32px;border-radius:22px;margin:22px 0 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}.hero strong{font:48px Georgia;color:#d6f1a8}.hero p{color:#dbe8dd}.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#c6e890 var(--progress),#49715b 0);flex:none}.ring b{background:#204b38;border-radius:50%;width:72px;height:72px;display:grid;place-items:center}.heading,article,.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.heading{margin-bottom:14px}button,input{font:inherit}button{cursor:pointer;border:1px solid #bac9bb;border-radius:12px;background:white;color:#244f38;padding:9px 15px}button.primary,.check[aria-pressed=true]{background:#284f3b;color:white}.check{width:44px;height:44px;padding:0;font-size:22px}.list{display:grid;gap:10px}article,.reward,.empty{border:1px solid #d7dfd4;background:white;border-radius:16px;padding:20px}article h3,.reward h3{overflow-wrap:anywhere}.icon{background:#eaf0df;border-radius:12px;padding:9px 13px;color:#41653d;font-size:20px}.row{justify-content:start}.section{margin-top:34px}.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}.reward{background:#f4f0e3;border-color:#e1dccb}.reward small{display:block;margin:6px 0}progress{accent-color:#587946;width:100%}dialog{border:0;border-radius:22px;width:min(440px,94vw);padding:25px;color:inherit}dialog::backdrop{background:#10261980}label{display:block;margin:16px 0}input{display:block;width:100%;padding:10px;border:1px solid #adbbaf;border-radius:8px}footer{margin:32px 0;color:#526457}.empty{color:#526457}@media(max-width:520px){main{padding-top:24px}.hero{padding:20px}.heading h2{font-size:20px}.icon{display:none}article{padding:14px}}
</style><header><span class="mark">✓</span> Daymark</header><main><small id="date"></small><h1>Daily practice</h1><div class="hero"><div><p>Today’s progress</p><strong id="score"></strong><p>habits completed</p></div><div class="ring"><b id="percent"></b></div></div><section><div class="heading"><h2>My habits</h2><button class="primary" id="add">+ Add habit</button></div><div class="list" id="habits"></div></section><section class="section"><h2>Reward shelf</h2><div class="rewards" id="rewards" style="margin-top:14px"></div></section><footer>Progress is saved in this browser on this device.</footer><div role="status" id="notice"></div></main><dialog><form><h2>Create a habit</h2><label>Daily habit<input required maxlength="90" placeholder="Read for 15 minutes" id="habitName"></label><label>Reward<input required maxlength="100" placeholder="A new book" id="rewardName"></label><label>Consecutive days to unlock<input type="number" id="goal" required min="1" max="365" value="7"></label><div class="row"><button type="submit" class="primary">Save habit</button><button type="button" id="cancel">Cancel</button></div></form></dialog><script>
const el=id=>document.getElementById(id), modal=document.querySelector('dialog'),key='daymark-habits-v1';
let data=JSON.parse(localStorage.getItem(key)||'[]');
function day(d=new Date()){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function streak(h,t){const dates=new Set(h.days);let end=dates.has(t)?t:t-1,count=0;while(dates.has(end--))count++;return count}
function best(h){let last=-2,n=0,max=0;for(const d of [...h.days].sort((a,b)=>a-b)){n=d===last+1?n+1:1;max=Math.max(max,n);last=d}return max}
function node(tag,txt,cls){const n=document.createElement(tag);n.textContent=txt||'';if(cls)n.className=cls;return n}
function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function render(){const t=day(),done=data.filter(h=>h.days.includes(t)).length,pct=data.length?Math.round(done/data.length*100):0;
el('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});el('score').textContent=done+' / '+data.length;el('percent').textContent=pct+'%';document.querySelector('.ring').style.setProperty('--progress',pct+'%');
const habits=el('habits'),rewards=el('rewards');habits.replaceChildren();rewards.replaceChildren();
if(!data.length){habits.append(node('p','Add your first daily habit and choose a reward to work toward.','empty'));rewards.append(node('p','Your streak rewards will appear here.','meta'))}
for(const h of data){const s=streak(h,t),ready=best(h)>=h.goal,checked=h.days.includes(t);const a=node('article'),r=node('div','','row'),copy=node('div'),check=node('button',checked?'✓':'+','check');check.setAttribute('aria-label',(checked?'Undo check-in for ':'Check in for ')+h.name);check.setAttribute('aria-pressed',checked);check.onclick=()=>{const now=day();if(h.days.includes(now))h.days=h.days.filter(d=>d!==now);else h.days.push(now);save()};copy.append(node('h3',h.name),node('small',s+'-day streak · Best '+best(h)+' days'));r.append(node('span','◇','icon'),copy);a.append(r,check);habits.append(a);
const card=node('div','','reward');card.append(node('small',h.name),node('h3',h.reward));if(h.claimed)card.append(node('p','✓ Reward claimed'));else if(ready){const claim=node('button','Claim reward');claim.onclick=()=>{h.claimed=true;save();el('notice').textContent='Reward claimed: '+h.reward};card.append(claim)}else{card.append(node('small',s+' of '+h.goal+' consecutive days'));const bar=node('progress');bar.max=h.goal;bar.value=s;bar.setAttribute('aria-label','Progress toward '+h.reward);card.append(bar)}rewards.append(card)}}
el('add').onclick=()=>modal.showModal();el('cancel').onclick=()=>modal.close();document.querySelector('form').onsubmit=e=>{e.preventDefault();const name=el('habitName').value.trim(),reward=el('rewardName').value.trim();if(!name||!reward)return;data.push({name,reward,goal:Number(el('goal').value),days:[],claimed:false});save();e.target.reset();modal.close()};window.addEventListener('storage',e=>{if(e.key===key){data=JSON.parse(e.newValue||'[]');render()}});render();setInterval(render,60000)
</script></html>
